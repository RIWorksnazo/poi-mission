<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポイすてっ！2 - MISSION MONITOR</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #eeeeee;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 左右分割レイアウト */
        #left-panel {
            width: 50%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #444;
        }
        #right-panel {
            width: 50%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        h1 {
            text-align: center;
            color: #00ffff;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        h2 {
            color: #ffcc00;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-size: 32px;
        }

        /* ▼▼ 追加：左上のコントロール部分 ▼▼ */
        .top-controls {
            text-align: center;
            margin-bottom: 15px;
        }
        .total-cleared {
            font-size: 24px;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 10px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #333;
        }
        .toggle-label {
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
            background: #333;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid #555;
            user-select: none;
        }
        .toggle-label input {
            margin-right: 5px;
            cursor: pointer;
        }
        /* ミッション名を隠すためのCSSマジック */
        .hide-names .m-name-text {
            display: none;
        }

        /* 右側の給料表示 */
        .money-board {
            text-align: center;
            padding: 40px;
            background: #2a2a2a;
            border-radius: 15px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
        }
        .money-number {
            color: #ffcc00;
            font-size: 90px;
            font-weight: bold;
            line-height: 1;
            margin: 10px 0;
        }

        /* マス目レイアウト */
        #mission-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            grid-auto-rows: 1fr;
            gap: 10px;
            flex-grow: 1;
            padding: 5px;
            overflow-y: auto;
        }
        .mission-item {
            background: #252525;
            border-radius: 8px;
            border: 3px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            transition: all 0.3s;
        }
        .mission-item.cleared {
            border-color: #00ffff;
            background: #0d2b2b;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .mission-name {
            font-size: 14px;
            font-weight: bold;
        }
        .m-name-text {
            margin-top: 5px;
        }

        #status {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
            width: 100%;
            position: absolute;
            bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- 左画面：ミッション状況 -->
    <div id="left-panel">
        <h1>MISSION STATUS</h1>
        
        <!-- ▼▼ 追加：クリア数とスイッチ ▼▼ -->
        <div class="top-controls">
            <div class="total-cleared">
                クリア数: <span id="cleared-count" style="font-size: 32px; color: #ff007f;">0</span> 問
            </div>
            <label class="toggle-label">
                <input type="checkbox" id="toggle-names" checked> ミッション名を表示する
            </label>
        </div>

        <div id="mission-container">
            <p style="text-align:center; grid-column: 1 / -1;">データを読み込み中...</p>
        </div>
    </div>

    <!-- 右画面：給料（円） -->
    <div id="right-panel">
        <h2>本日の給料</h2>
        <div class="money-board">
            <div style="font-size: 24px; color: #ccc;">現在の給料</div>
            <div class="money-number"><span id="total-money">0</span> 円</div>
        </div>
    </div>
    
    <div id="status">通信待機中...</div>

   <script>
        // ▼▼▼ ここにGASのURLを貼り直してください ▼▼▼
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let isFetching = false;

        document.getElementById('toggle-names').addEventListener('change', function(e) {
            const container = document.getElementById('mission-container');
            if (e.target.checked) {
                container.classList.remove('hide-names');
            } else {
                container.classList.add('hide-names');
            }
        });

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;

            try {
                document.getElementById('status').innerText = "更新中...";
                const response = await fetch(GAS_URL);
                const data = await response.json();
                
                render(data);
                document.getElementById('status').innerText = "最新のデータです";
            } catch (error) {
                console.error("通信エラー:", error);
                document.getElementById('status').innerText = "通信エラーが発生しました。";
            } finally {
                isFetching = false;
                setTimeout(fetchData, 5000); 
            }
        }

        function render(data) {
            const container = document.getElementById('mission-container');
            const countElement = document.getElementById('cleared-count');
            
            let htmlString = "";
            let clearedCount = 0; 

            data.missions.forEach(m => {
                // ▼▼ 追加：スプレッドシートのD列にチェックが無い場合は、画面に出さずにスキップする ▼▼
                if (!m.visible) return;

                if (m.cleared) {
                    clearedCount++;
                }

                htmlString += `
                    <div class="mission-item ${m.cleared ? 'cleared' : ''}">
                        <div class="mission-name">
                            ${m.cleared ? '✅' : '🔒'}
                            <div class="m-name-text">${m.name}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = htmlString;
            countElement.innerText = clearedCount; 

            // 右側の給料更新
            const moneyElement = document.getElementById('total-money');
            moneyElement.innerText = data.totalMoney;
        }

        fetchData();

    </script>
</body>
</html>
