<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - INFO MONITOR</title>
    <style>
        body { 
            margin: 0; padding: 2vh 0; 
            background-color: #fdf6e3; 
            color: #333; 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', Meiryo, sans-serif;
            box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; overflow: hidden; justify-content: center;
        }
        
        /* 上の3つを縦に並べて画面いっぱいに巨大化 */
        .header-container {
            display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; gap: 3vh; height: 95vh; margin-bottom: 0; width: 100%;
        }
        
        #global-timer, #score-display, #money-display {
            flex: none; width: 90%; height: 28vh;
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
        }
        
        #global-timer {
            background: #fff; border: 1vw solid #ff5252; color: #ff5252; box-shadow: 0 10px 0 #d32f2f; flex-direction: column;
        }
        .timer-time { font-size: 12vw; letter-spacing: 5px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .timer-help { display: none; } /* 不要な小文字を非表示 */
        #global-timer.paused { background: #ffebee; color: #b71c1c; border-color: #b71c1c; box-shadow: 0 10px 0 #7f0000; }

        #score-display {
            background: #4caf50; color: #fff; font-size: 7vw; font-weight: bold; box-shadow: 0 10px 0 #388e3c; letter-spacing: 2px;
        }
        
        #money-display {
            background: #ff9800; color: #fff; font-size: 7vw; font-weight: bold; box-shadow: 0 10px 0 #f57c00; letter-spacing: 2px;
        }
        
        #footer-info { position: absolute; bottom: 10px; right: 20px; font-size: 18px; color: #666; z-index: 101; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-container">
        <div id="global-timer">
            <div class="timer-time" id="timer-text">00:00</div>
            <div class="timer-help"></div>
        </div>
        <div id="score-display">現在解いた問題数: 0問</div>
        <div id="money-display">現在の給料: ¥0</div>
    </div>
    
    <div id="footer-info">
        <div id="status">SYS: STANDBY...</div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let tState = localStorage.getItem('tState') || 'running';
        let tStart = parseInt(localStorage.getItem('tStart')) || Date.now();
        let tPauseTotal = parseInt(localStorage.getItem('tPauseTotal')) || 0;
        let tPauseBegin = parseInt(localStorage.getItem('tPauseBegin')) || 0;

        function saveTimer() {
            localStorage.setItem('tState', tState);
            localStorage.setItem('tStart', tStart);
            localStorage.setItem('tPauseTotal', tPauseTotal);
            localStorage.setItem('tPauseBegin', tPauseBegin);
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                if (tState === 'running') {
                    tState = 'paused';
                    tPauseBegin = Date.now();
                } else {
                    tState = 'running';
                    tPauseTotal += (Date.now() - tPauseBegin); 
                }
                saveTimer();
            } 
            else if (e.key === 'r' || e.key === 'R') {
                tState = 'running';
                tStart = Date.now();
                tPauseTotal = 0;
                tPauseBegin = 0;
                saveTimer();
            }
            // エンターキーでのリロードを無効化（誤作動防止）
            updateTimerUI();
        });

        function getElapsedMs() {
            if (tState === 'paused') {
                return tPauseBegin - tStart - tPauseTotal;
            } else {
                return Date.now() - tStart - tPauseTotal;
            }
        }

        function updateTimerUI() {
            const elapsed = getElapsedMs();
            const totalSec = Math.max(0, Math.floor(elapsed / 1000));
            const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
            const sec = String(totalSec % 60).padStart(2, '0');
            
            const timerBox = document.getElementById('global-timer');
            const timerText = document.getElementById('timer-text');
            
            if (tState === 'paused') {
                timerText.innerText = `PAUSE ${min}:${sec}`;
                timerBox.classList.add('paused');
            } else {
                timerText.innerText = `${min}:${sec}`;
                timerBox.classList.remove('paused');
            }
        }

        // GASからデータを取得して画面を更新
        async function fetchAndUpdate() {
            try {
                // キャッシュを防ぐためにランダムなパラメータを付ける
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                
                // 表示を更新
                document.getElementById('money-display').innerText = `現在の給料: ¥${data.totalMoney.toLocaleString()}`;
                document.getElementById('score-display').innerText = `現在解いた問題数: ${data.totalQuestions}問`;
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            }
        }

        // 初回実行
        fetchAndUpdate();

        // 3秒ごとに自動更新
        setInterval(() => {
            updateTimerUI();
            fetchAndUpdate();
        }, 3000);
    </script>
</body>
</html>
