<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポイすてっ！2 - MISSION MONITOR</title>
    <style>
        /* アングラ×ポップなダークデザイン */
        body {
            background-color: #1a1a1a;
            color: #eeeeee;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ffff;
            letter-spacing: 2px;
        }
        .score-board {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 2px solid #333;
        }
        .score-number {
            color: #ff007f;
            font-size: 40px;
        }
        .mission-item {
            background: #252525;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .mission-item.cleared {
            border-left: 5px solid #ff007f;
            background: #331424;
        }
        .mission-name {
            font-size: 20px;
        }
        .mission-points {
            font-weight: bold;
            color: #00ffff;
            font-size: 18px;
        }
        #status {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>MISSION STATUS</h1>

    <div class="score-board">
        TOTAL POINTS<br>
        <span class="score-number" id="total-score">0</span> pt
    </div>

    <div id="mission-container">
        <p style="text-align:center;">データを読み込み中...</p>
    </div>
    
    <div id="status">通信待機中...</div>

    <script>
        // ▼▼▼ 唯一の変更箇所 ▼▼▼
        // コピーした「ウェブアプリのURL」を、以下の " " の中に貼り付けてください。
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        // ▲▲▲ 唯一の変更箇所 ▲▲▲

        async function fetchData() {
            try {
                document.getElementById('status').innerText = "更新中...";
                const response = await fetch(GAS_URL);
                const missions = await response.json();
                
                render(missions);
                document.getElementById('status').innerText = "最新のデータです";
            } catch (error) {
                console.error("通信エラー:", error);
                document.getElementById('status').innerText = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
            }
        }

        function render(missions) {
            const container = document.getElementById('mission-container');
            const scoreElement = document.getElementById('total-score');
            
            container.innerHTML = '';
            let totalScore = 0;

            missions.forEach(m => {
                if (m.cleared) totalScore += m.points;

                const div = document.createElement('div');
                div.className = `mission-item ${m.cleared ? 'cleared' : ''}`;
                div.innerHTML = `
                    <div class="mission-name">${m.cleared ? '✅' : '🔒'} ${m.name}</div>
                    <div class="mission-points">${m.points} pt</div>
                `;
                container.appendChild(div);
            });

            scoreElement.innerText = totalScore;
        }

        // 初回読み込みと自動更新の設定
        if(GAS_URL !== "ここにURLを貼り付けます") {
            fetchData();
            // 5秒ごとにスプレッドシートの最新状況を自動取得
            setInterval(fetchData, 5000);
        } else {
            document.getElementById('mission-container').innerHTML = "<p style='text-align:center;color:red;'>GASのURLが設定されていません</p>";
        }
    </script>
</body>
</html>
