<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポイすてっ！2 - MISSION MONITOR</title>
    <style>
        /* アングラ×ポップなダークデザイン */
        body {
            background-color: #1a1a1a;
            color: #eeeeee;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            /* 1画面に収めるための設定 */
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            color: #00ffff;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        .score-board {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 2px solid #333;
        }
        .score-number {
            color: #ff007f;
            font-size: 40px;
            line-height: 1;
        }
        
        /* ▼▼▼ マス目（グリッド）レイアウト ▼▼▼ */
        #mission-container {
            display: grid;
            /* 列数を自動調整し、マスを敷き詰める */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            /* 縦幅も画面の余白に合わせて均等に伸ばす */
            grid-auto-rows: 1fr;
            gap: 15px;
            flex-grow: 1;
            padding: 5px;
        }
        .mission-item {
            background: #252525;
            border-radius: 8px;
            border: 3px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            transition: all 0.3s;
        }
        .mission-item.cleared {
            border-color: #ff007f;
            background: #331424;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }
        .mission-name {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .mission-points {
            font-weight: bold;
            color: #00ffff;
            font-size: 22px;
        }
        /* ▲▲▲ マス目の設定ここまで ▲▲▲ */

        #status {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>MISSION STATUS</h1>

    <div class="score-board">
        TOTAL <span class="score-number" id="total-score">0</span> pt
    </div>

    <div id="mission-container">
        <p style="text-align:center; grid-column: 1 / -1;">データを読み込み中...</p>
    </div>
    
    <div id="status">通信待機中...</div>

   <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";

        async function fetchData() {
            try {
                document.getElementById('status').innerText = "更新中...";
                const response = await fetch(GAS_URL);
                const missions = await response.json();
                
                render(missions);
                document.getElementById('status').innerText = "最新のデータです";
            } catch (error) {
                console.error("通信エラー:", error);
                document.getElementById('status').innerText = "通信エラーが発生しました。URLや設定を確認してください。";
            }
        }

        function render(missions) {
            const container = document.getElementById('mission-container');
            const scoreElement = document.getElementById('total-score');
            
            container.innerHTML = '';
            let totalScore = 0;

            missions.forEach(m => {
                if (m.cleared) totalScore += m.points;

                const div = document.createElement('div');
                div.className = `mission-item ${m.cleared ? 'cleared' : ''}`;
                div.innerHTML = `
                    <div class="mission-name">${m.cleared ? '✅' : '🔒'}<br>${m.name}</div>
                    <div class="mission-points">${m.points} pt</div>
                `;
                container.appendChild(div);
            });

            scoreElement.innerText = totalScore;
        }

        // if文を消し去り、直接実行させる
        fetchData();
        setInterval(fetchData, 5000);

    </script>
</body>
</html>
