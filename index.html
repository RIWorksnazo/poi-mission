<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポイすてっ！2 ステータスモニター</title>
<style>
  body {
    background-color: #fdfaf0; /* 元の優しいクリーム色の背景 */
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly; /* 3つの箱を縦に均等配置 */
    align-items: center;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    padding: 2vh 0;
    box-sizing: border-box;
  }

  /* 3つのボックスの共通スタイル（元のUIを完全再現） */
  .status-box {
    width: 90%;
    height: 28vh; /* 画面の約3割の高さに巨大化 */
    border-radius: 20px; /* 元の丸み */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 6vw; /* モニター幅に合わせて文字を巨大化 */
    font-weight: bold;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
  }

  /* 赤枠のタイマー */
  .box-timer {
    background-color: #ffffff;
    color: #c0392b;
    border: 1vw solid #c0392b; /* 太い赤枠 */
  }

  /* 緑の問題数 */
  .box-solved {
    background-color: #58b970;
    color: #ffffff;
  }

  /* オレンジの給料 */
  .box-salary {
    background-color: #f39c12;
    color: #ffffff;
  }
</style>
</head>
<body>

  <div class="status-box box-timer" id="timer-display">
    PAUSE 00:00
  </div>
  
  <div class="status-box box-solved">
    現在解いた問題数：<span id="solved-count">0</span>問
  </div>
  
  <div class="status-box box-salary">
    現在の給料：¥<span id="salary-display">0</span>
  </div>

  <script>
    // いただいたGASのWebアプリURL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";

    // GASからデータを取得して画面を書き換える関数
    async function fetchGasData() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        
        // ※注意：GAS側が書き出すJSONの「キー名」に合わせて data.〇〇 を書き換えてください。
        // （例として timer, solved, salary という名前でデータが来ると仮定しています）
        
        // 1. タイマーの更新
        if (data.timer !== undefined) {
          document.getElementById('timer-display').innerText = data.timer;
        }
        
        // 2. 問題数の更新
        if (data.solved !== undefined) {
          document.getElementById('solved-count').innerText = data.solved;
        }
        
        // 3. 給料の更新（toLocaleStringで自動的に ¥37,500 のようにカンマがつきます）
        if (data.salary !== undefined) {
          document.getElementById('salary-display').innerText = Number(data.salary).toLocaleString();
        }
        
      } catch (error) {
        console.error("GASからのデータ取得に失敗しました:", error);
      }
    }

    // 3秒ごとにGASにアクセスして最新の数字に更新する（早すぎるとGASの制限に引っかかるので3秒推奨です）
    setInterval(fetchGasData, 3000);
    
    // ページを開いた瞬間に1回目の読み込みを実行
    fetchGasData();
  </script>

</body>
</html>
