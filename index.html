<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廃棄物処理タスク管理</title>
    <style>
        /* 無骨でフラットな工業・業務デザイン */
        body {
            background-color: #0f0f0f;
            color: #d0d0d0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* ヘッダー：単なる線と文字だけの簡素な表示 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #fff;
            letter-spacing: 2px;
        }
        .score-board {
            font-size: 16px;
        }
        .score-number {
            font-size: 32px;
            font-weight: bold;
            color: #ff9800; /* 作業現場の警戒色（オレンジ） */
            margin-left: 10px;
        }

        /* ミッション一覧：マス目レイアウト */
        #mission-container {
            display: grid;
            /* 1つのマスを最低110pxとし、画面幅に合わせて自動で列を増やす */
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 6px; /* 隙間を詰めて密度を上げる */
        }

        /* 各マス目のデザイン */
        .mission-item {
            background: #1a1a1a;
            border: 1px solid #333;
            aspect-ratio: 1 / 1; /* 正方形 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .mission-name {
            font-size: 13px;
            font-weight: bold;
            line-height: 1.3;
            word-break: keep-all;
            z-index: 2;
        }
        .mission-points {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            z-index: 2;
        }

        /* クリア済みのマス（ハンコが押されたような表現） */
        .mission-item.cleared {
            background: #111;
            border-color: #2e7d32; /* くすんだ緑 */
        }
        .mission-item.cleared .mission-name,
        .mission-item.cleared .mission-points {
            color: #444; /* 文字を暗くして目立たなくする */
        }
        /* クリアスタンプ */
        .mission-item.cleared::after {
            content: "済";
            position: absolute;
            font-size: 50px;
            font-weight: bold;
            color: rgba(76, 175, 80, 0.4);
            transform: rotate(-20deg);
            pointer-events: none;
            z-index: 1;
        }

        /* 画面右下の控えめなステータス表示 */
        #loading {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 11px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>TASK STATUS</h1>
        <div class="score-board">
            TOTAL<span class="score-number" id="total-score">0</span> pt
        </div>
    </div>

    <div id="mission-container">
        <!-- Javascriptでマス目がここに並びます -->
    </div>
    
    <div id="loading">SYS_WAITING...</div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzjkVymYQZbGL8rk-QsgLtaHAk3lVANi7pf2TC5HBBdkeAj6EKJYbxV6VVT5McI7gNL/exec";

        async function fetchMissions() {
            try {
                const response = await fetch(API_URL);
                const missions = await response.json();
                render(missions);
                document.getElementById('loading').innerText = "SYS_ONLINE";
            } catch (error) {
                document.getElementById('loading').innerText = "SYS_ERROR";
            }
        }

        function render(missions) {
            const container = document.getElementById('mission-container');
            let totalScore = 0;
            let htmlContent = '';

            missions.forEach(m => {
                if (m.cleared) totalScore += m.points;
                
                htmlContent += `
                    <div class="mission-item ${m.cleared ? 'cleared' : ''}">
                        <div class="mission-name">${m.name}</div>
                        <div class="mission-points">${m.points} pt</div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
            document.getElementById('total-score').innerText = totalScore;
        }

        fetchMissions();
        setInterval(fetchMissions, 1000); // 1秒ごとに更新
    </script>
</body>
</html>
