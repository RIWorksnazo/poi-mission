<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポイすてっ！2 - MISSION STATUS</title>
    <style>
        /* アングラ×ポップなダークデザイン */
        body {
            background-color: #1a1a1a;
            color: #eeeeee;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #00ffff; /* ネオンシアン */
            letter-spacing: 2px;
            font-size: 36px;
        }
        .score-board {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }
        .score-number {
            color: #ff007f; /* ネオンピンク */
            font-size: 48px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        
        /* ミッションリストの装飾 */
        #mission-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .mission-item {
            background: #252525;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 6px;
            border-left: 5px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.5s ease;
        }
        .mission-item.cleared {
            border-left: 5px solid #ff007f;
            background: #331424;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }
        .mission-name {
            font-size: 22px;
        }
        .mission-points {
            font-size: 22px;
            font-weight: bold;
            color: #00ffff;
        }
        
        /* 更新中の表示 */
        #loading {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>MISSION STATUS</h1>

    <div class="score-board">
        TOTAL POINTS<br>
        <span class="score-number" id="total-score">0</span> pt
    </div>

    <div id="mission-container">
        <div style="text-align: center; color: #888;">データを読み込み中...</div>
    </div>
    
    <div id="loading">● 自動更新待機中...</div>

    <script>
        // 取得したスプレッドシートのWebアプリURL
        const API_URL = "https://script.google.com/macros/s/AKfycbw2Z9mto7qcjuiL7-qB-VDhiu9plyDoKTFsIJa4EWnI40TOpkxbX6uzXW0kOcFuATpU/exec";

        // データを取得して画面を描画する関数
        async function fetchMissions() {
            try {
                document.getElementById('loading').innerText = "🔄 データ取得中...";
                const response = await fetch(API_URL);
                const missions = await response.json();
                
                render(missions);
                document.getElementById('loading').innerText = "● 自動更新待機中...";
            } catch (error) {
                console.error("データの取得に失敗しました:", error);
                document.getElementById('loading').innerText = "⚠️ 通信エラー：再試行します";
            }
        }

        // 画面の更新処理
        function render(missions) {
            const container = document.getElementById('mission-container');
            let totalScore = 0;
            let htmlContent = '';

            missions.forEach(m => {
                if (m.cleared) totalScore += m.points;
                
                htmlContent += `
                    <div class="mission-item ${m.cleared ? 'cleared' : ''}">
                        <div class="mission-name">${m.cleared ? '✅' : '🔒'} ${m.name}</div>
                        <div class="mission-points">${m.points} pt</div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
            document.getElementById('total-score').innerText = totalScore;
        }

        // 初回読み込み
        fetchMissions();

        // 3秒ごとに自動更新（3000ミリ秒）
        setInterval(fetchMissions, 1000);
    </script>
</body>
</html>
